<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>China Desk - Pedido</title>
    <link rel="stylesheet" href="/frontend/CSS/styles-Menu.css">
</head>
<body>

<header>
    <h1>CHINA DESK</h1>
    <button class="btn-abrir">
        Hacer Pedido
        <span class="flecha"></span>
    </button>
</header>

<!-- POPUP (visible solo para diseño estático) -->
<div class="overlay active">
    <div class="menu-container">

        <button class="cerrar">✕</button>

        <h2>Arma tu Platillo</h2>

        <!-- 1. PAQUETE -->
        <div class="seccion">
            <h3>1. Elige tu Platillo</h3>
            <div class="opciones">
                <div class="card">1 Guiso</div>
                <div class="card">2 Guisos</div>
                <div class="card">3 Guisos</div>
            </div>
        </div>

        <!-- 2. BASE -->
        <div class="seccion">
            <h3>2. Arroz o Pasta</h3>
            <div class="opciones">
                <div class="card">Arroz</div>
                <div class="card">Pasta</div>
            </div>
        </div>

        <!-- 3. GUISOS -->
        <div class="seccion">
            <h3>3. Guisos</h3>
            <div class="opciones">
                <div class="card">Res</div>
                <div class="card">Pollo</div>
                <div class="card">Puerco</div>
                <div class="card">Res Picante</div>
                <div class="card">Pollo Picante</div>
                <div class="card">Puerco Picante</div>
            </div>
        </div>

        <!-- 4. BEBIDAS -->
        <div class="seccion">
            <h3>4. Bebidas</h3>

            <div class="drink">
                <span>Agua</span>
                <button>-</button>
                <span>0</span>
                <button>+</button>
            </div>

            <div class="drink">
                <span>Refresco</span>
                <button>-</button>
                <span>0</span>
                <button>+</button>
            </div>

            <div class="drink">
                <span>Sin Azúcar</span>
                <button>-</button>
                <span>0</span>
                <button>+</button>
            </div>
        </div>

        <div class="seccion total-section">
            <h3>Total: $0</h3>
        </div>

        <button class="btn-confirmar">
            Confirmar Pedido
        </button>

    </div>
</div>

</body>
</html>
